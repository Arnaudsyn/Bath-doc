  };
  const supported = Object.keys(copy);
  function setLanguage(lang, persist=false){
    if(!supported.includes(lang)) lang='en';
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-copy]').forEach(el=>{
      const value=copy[lang][el.dataset.copy];
      el.textContent=value;
      if(el.dataset.copy==='title'){el.style.whiteSpace='pre-line';}
    });
    document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));

    document.querySelector('.qr-link').setAttribute('aria-label',copy[lang].qrLabel);
    // Keep the QR destination fixed; direct links open the currently selected language.
    document.querySelectorAll('a').forEach(el=>el.href='https://arnaudsyn.github.io/Bath-doc/?lang='+lang);
    if(persist){
      try{localStorage.setItem('bath-doc-lang',lang);}catch{}
      const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);
    }
  }
  let stored;try{stored=localStorage.getItem('bath-doc-lang');}catch{}
  const requested=new URLSearchParams(location.search).get('lang');
  const browser=(navigator.languages?.[0]||navigator.language||'en').toLowerCase().split('-')[0];
  setLanguage([requested,stored,browser,'en'].find(lang=>supported.includes(lang)));
  document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>setLanguage(el.dataset.lang,true)));
})();
