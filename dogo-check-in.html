<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f5f3ef">
  <title>道後温泉本館 ご予約確認 | Dōgo Onsen check-in</title>
  <style>
    :root { color-scheme: light; background: #f5f3ef; color: #171614; font: 100%/1.35 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; border-top: 6px solid #171614; }
    main { max-width: 34rem; margin: 0 auto; padding: clamp(1rem, 5vw, 2.25rem); }
    h1, h2, p, dl, dd { margin: 0; }
    .en, dt, .eyebrow { color: #51504c; }
    .en { display: block; font-size: .9rem; }
    .eyebrow { font-size: .8rem; font-weight: 650; }
    h1 { margin-top: .35rem; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(1.9rem, 8vw, 3rem); }
    .date { margin: .9rem 0; border-top: 1px solid #c8c3bb; padding-top: .75rem; }
    .date strong { font-size: 1.2rem; }
    section { border: 1px solid #d8d4cb; border-radius: .9rem; background: white; padding: .85rem 1rem; margin-bottom: .65rem; }
    h2 { font-size: 1.45rem; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; border-top: 1px solid #ddd8d1; padding-top: .45rem; margin-top: .55rem; }
    dt { font-size: .75rem; }
    dd { font-size: clamp(1.95rem, 9vw, 3.25rem); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.12; white-space: nowrap; }
    .name { margin-top: .85rem; }
    .name strong { display: block; font-size: 1.2rem; margin-top: .12rem; }
    .notice { margin-top: 1rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">ご予約確認 <span lang="en">/ RESERVATION CHECK-IN</span></p>
      <h1>道後温泉本館</h1>
      <p class="en" lang="en">Dōgo Onsen Honkan</p>
    </header>
    <div id="card" hidden>
      <p class="date"><strong id="date-ja"></strong><span class="en" lang="en" id="date-en"></span></p>
      <section aria-labelledby="hisho">
        <h2 id="hisho">飛翔の間</h2>
        <p class="en" lang="en">Hishō no Ma</p>
        <dl>
          <div><dt>時間 <span lang="en">/ Time</span></dt><dd id="time-a"></dd></div>
          <div><dt>予約ID <span lang="en">/ Reservation ID</span></dt><dd id="id-a"></dd></div>
        </dl>
      </section>
      <section aria-labelledby="shirasagi">
        <h2 id="shirasagi">しらさぎの間</h2>
        <p class="en" lang="en">Shirasagi no Ma</p>
        <dl>
          <div><dt>時間 <span lang="en">/ Time</span></dt><dd id="time-b"></dd></div>
          <div><dt>予約ID <span lang="en">/ Reservation ID</span></dt><dd id="id-b"></dd></div>
        </dl>
      </section>
      <footer class="name">
        <p class="eyebrow">予約名 <span lang="en">/ Booking name</span></p>
        <strong id="name-ja"></strong>
        <p class="en" lang="en" id="name-en"></p>
      </footer>
    </div>
    <p id="notice" class="notice">ご予約内容を表示するには、予約確認用のリンクを開いてください。<span class="en" lang="en">Open the full check-in link to display your reservation details.</span></p>
  </main>
  <script>
    function renderCard() {
      const params = new URLSearchParams(location.hash.slice(1));
      const dateText = params.get('d') || '';
      const date = new Date(`${dateText}T00:00:00Z`);
      const [timeA, idA, timeB, idB, nameJa, nameEn] = ['ta', 'a', 'tb', 'b', 'ja', 'en'].map(key => params.get(key) || '');
      const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;
      const idPattern = /^\d{1,8}$/;
      const validDate = /^\d{4}-\d{2}-\d{2}$/.test(dateText) && Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === dateText;
      const hasDetails = validDate && timePattern.test(timeA) && timePattern.test(timeB) && idPattern.test(idA) && idPattern.test(idB) && nameJa && nameEn;
      document.getElementById('card').hidden = !hasDetails;
      document.getElementById('notice').hidden = Boolean(hasDetails);
      if (!hasDetails) return;

      const dateStyle = { timeZone: 'UTC', year: 'numeric', month: 'long', day: 'numeric' };
      const weekdayJa = new Intl.DateTimeFormat('ja-JP', { timeZone: 'UTC', weekday: 'short' }).format(date);
      const values = {
        'date-ja': `${new Intl.DateTimeFormat('ja-JP', dateStyle).format(date)}（${weekdayJa}）`,
        'date-en': new Intl.DateTimeFormat('en-GB', { ...dateStyle, weekday: 'long' }).format(date),
        'time-a': timeA, 'id-a': idA, 'time-b': timeB, 'id-b': idB, 'name-ja': nameJa, 'name-en': nameEn
      };
      for (const [id, value] of Object.entries(values)) document.getElementById(id).textContent = value;
    }
    renderCard();
    window.addEventListener('hashchange', renderCard);
  </script>
</body>
</html>
